<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="72" viewBox="0 0 1000 72" fill="none" role="img"><title>02 / stack</title><style>@font-face{font-family:'JBM';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IS';font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}
.m{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{font-family:'IS','Iowan Old Style',Georgia,serif}
.in{animation:in .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade{animation:fade .6s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.draw{stroke-dasharray:1;animation:draw 1s cubic-bezier(.4,0,.2,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flash{opacity:0;animation:flash .1s linear none}
@keyframes flash{from,to{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.75}100%{transform:scale(3.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.run{animation:run 7s cubic-bezier(.6,0,.4,1) infinite}@keyframes run{0%{transform:translateX(-64px);opacity:0}10%{opacity:1}60%,100%{transform:translateX(1000px);opacity:0}}</style><defs><linearGradient id="hg" x1="0" x2="1"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#8b949e" stop-opacity=".55"/><stop offset="1" stop-color="#8b949e" stop-opacity=".08"/></linearGradient></defs><text class="m" x="2" y="42" font-size="13" font-weight="700" fill="#0891b2">02</text><text class="m" x="27" y="42" font-size="13" fill="#8b949e">/</text><text class="s" x="44" y="45" font-size="38" font-style="italic" fill="url(#hg)" textLength="70.1" lengthAdjust="spacingAndGlyphs">stack</text><text class="m" x="998" y="42" font-size="12" fill="#8b949e" text-anchor="end">// only what I've actually shipped with</text><rect x="0" y="60" width="1000" height="1" fill="url(#hl)"/><rect class="run" x="0" y="59.5" width="64" height="2" rx="1" fill="url(#hg)"/></svg>