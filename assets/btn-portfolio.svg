<svg xmlns="http://www.w3.org/2000/svg" width="146" height="48" viewBox="0 0 146 48" fill="none" role="img"><title>Portfolio</title><style>@font-face{font-family:'JBM';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
.m{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{font-family:'IS','Iowan Old Style',Georgia,serif}
.in{animation:in .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade{animation:fade .6s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.draw{stroke-dasharray:1;animation:draw 1s cubic-bezier(.4,0,.2,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flash{opacity:0;animation:flash .1s linear none}
@keyframes flash{from,to{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.75}100%{transform:scale(3.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
