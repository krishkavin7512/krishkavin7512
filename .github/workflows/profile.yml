name: profile

# Rebuilds the live images (telemetry card + contribution snake) and
# force-pushes them to the `output` branch, which the README links to.
on:
  schedule:
    - cron: "17 0 * * *" # nightly, 05:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font subsetter
        run: pip install fonttools==4.55.3 brotli==1.1.0

      - name: Telemetry card
        run: python scripts/telemetry.py dist/telemetry.svg "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0e4250,#0e7490,#22d3ee,#a78bfa
            dist/snake-light.svg?color_snake=#0891b2&color_dots=#ebedf0,#a5f3fc,#22d3ee,#0891b2,#7c3aed

      - name: Publish to output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "telemetry + snake $(date -u +%F)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
